<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>HowLocal post</title>
<!-- One TikTok post, drawn at 1080x1920. social/render.mjs loads a post into it, steps the
     clock frame by frame with seek(t), and turns the frames into a video. -->
<style>
@font-face { font-family: "Poppins"; font-weight: 500; src: url("../assets/fonts/poppins-latin-500-normal.woff2") format("woff2"); }
@font-face { font-family: "Poppins"; font-weight: 600; src: url("../assets/fonts/poppins-latin-600-normal.woff2") format("woff2"); }
@font-face { font-family: "Poppins"; font-weight: 800; src: url("../assets/fonts/poppins-latin-800-normal.woff2") format("woff2"); }

:root {
  --navy-deep: #101A2E;
  --navy: #14203A;
  --navy-rise: #1D2C4F;
  --yellow: #FEC300;
  --paper: #F4F6FB;
  --white: #FFFFFF;
  --ink: #101A2E;
  --ink-soft: #515C78;
  --mist: #AAB5CE;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  width: 1080px;
  height: 1920px;
  overflow: hidden;
  background: var(--navy-deep);
  color: var(--white);
  font-family: "Poppins", sans-serif;
  -webkit-font-smoothing: antialiased;
}

.frame {
  position: relative;
  width: 1080px;
  height: 1920px;
  background: radial-gradient(1100px 900px at 50% 38%, var(--navy) 0%, var(--navy-deep) 70%);
  overflow: hidden;
}

/* The striped awning from the logo, hung across the top. */
.awning { display: flex; position: absolute; left: 0; right: 0; top: 0; filter: drop-shadow(0 10px 12px rgba(4, 8, 18, 0.5)); }
.awning span { flex: 1; display: flex; flex-direction: column; }
.awning span::before { content: ""; height: var(--drop, 64px); background: var(--c, var(--white)); }
.awning span::after { content: ""; aspect-ratio: 2 / 1; margin-top: -1px; border-radius: 0 0 999px 999px; background: var(--c, var(--white)); }
.awning span:nth-child(even) { --c: var(--yellow); }

.brand {
  position: absolute;
  top: 190px;
  left: 0;
  right: 0;
  text-align: center;
  font: 800 44px/1 "Poppins";
  letter-spacing: 0.01em;
}
.brand b { color: var(--yellow); font-weight: 800; }

.hook {
  position: absolute;
  top: 268px;
  left: 70px;
  right: 70px;
  text-align: center;
  font: 800 96px/1.0 "Poppins";
  letter-spacing: -0.025em;
}
.hook span { display: block; }
.hook span + span { color: var(--yellow); }

/* A storefront card, like the cards in the app. */
.card {
  position: absolute;
  left: 70px;
  width: 880px;
  border-radius: 44px;
  background: var(--card-paper, var(--paper));
  color: var(--card-ink, var(--ink));
  overflow: hidden;
  box-shadow: 0 30px 60px rgba(4, 8, 18, 0.45);
}
.card .awning { position: relative; filter: drop-shadow(0 6px 5px rgba(16, 26, 46, 0.22)); }
.card .awning span { --c: var(--hue); }
.card .awning span:nth-child(even) { --c: var(--stripe2, var(--white)); }
.card__body { position: relative; padding: 18px 54px 40px; }

/* A real photo of the place, under the awning, with the business's logo on its corner. */
.card__photo { position: relative; height: calc(var(--photo-h, 300px) * var(--fit, 1)); margin-top: -40px; overflow: hidden; background: var(--navy); }
.card__photo img.shot { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform-origin: 50% 60%; }
.card__photo::after { content: ""; position: absolute; inset: auto 0 0 0; height: 90px; background: linear-gradient(transparent, rgba(16, 26, 46, 0.55)); }
.card__credit { position: absolute; right: 18px; bottom: 12px; z-index: 1; font: 500 20px/1.2 "Poppins"; color: rgba(255, 255, 255, 0.9); text-shadow: 0 1px 3px rgba(0, 0, 0, 0.6); }
.card__logo { position: absolute; left: 40px; bottom: 18px; z-index: 1; display: grid; place-items: center; width: 132px; height: 132px; padding: 14px; border-radius: 50%; background: var(--white); box-shadow: 0 0 0 6px var(--hue), 0 10px 20px rgba(4, 8, 18, 0.35); }
.side .card { width: 470px; border-radius: 36px; }
.side .card__photo { height: calc(430px * var(--fit, 1)); }
.side .card__body { padding: 18px 30px 34px; }
.side .card__name { font-size: calc(58px * var(--fit, 1)); }
.side .card__fact { font-size: 32px; }
.side .card__where { font-size: 26px; align-items: flex-start; }
.side .card__where svg { width: 28px; height: 28px; margin-top: 2px; }
.side .card .card__kind--chip { left: 18px; top: 52px; font-size: 26px; padding: 6px 18px 6px 6px; }
.side .card .card__kind--chip .card__icon { width: 44px; height: 44px; }
.side .card__tag { top: auto; bottom: 26px; right: 22px; width: 76px; height: 76px; font-size: 44px; }
.side .card--tagged .card__name { padding-right: 0; }
.side .card__body { padding-bottom: 110px; }
.side .stamp { top: 30%; right: 30px; font-size: 52px; }
.side .card { transform-origin: 50% 0; }
.side .card__credit { font-size: 15px; }
.side .card--first .card__credit { left: 16px; right: auto; }
.card .card__kind--chip { position: absolute; left: 30px; top: 58px; z-index: 2; padding: 8px 22px 8px 8px; border-radius: 999px; background: rgba(255, 255, 255, 0.95); box-shadow: 0 6px 16px rgba(16, 26, 46, 0.25); font-size: 30px; }
.card .card__kind--chip .card__icon { width: 52px; height: 52px; border-radius: 999px; }
.card .card__kind--chip .card__icon svg { width: 30px; height: 30px; }
.card--photo .card__body { padding-top: 22px; }
.card__pin { position: absolute; left: 50%; top: 50%; z-index: 1; width: 64px; transform: translate(-50%, -100%); filter: drop-shadow(0 6px 6px rgba(16, 26, 46, 0.4)); }
.card__pin svg { display: block; width: 100%; }
.card__logo img { max-width: 100%; max-height: 100%; object-fit: contain; }
.card--photo .card__awning-wrap { position: relative; z-index: 2; }
.card--photo .card__tag { top: 70px; z-index: 3; box-shadow: 0 0 0 6px var(--white); }
.card__kind { display: flex; align-items: center; gap: 18px; font: 600 34px/1.1 "Poppins"; }
.card__icon { display: grid; place-items: center; width: 64px; height: 64px; border-radius: 16px; background: var(--hue); color: var(--on-hue, var(--white)); }
.card__icon svg { width: 38px; height: 38px; }
.card__name { margin-top: 14px; font: 800 calc(84px * var(--fit, 1))/1.02 "Poppins"; letter-spacing: -0.03em; }
.card__fact { margin-top: 14px; font: 600 40px/1.22 "Poppins"; color: var(--card-ink, var(--ink)); }
.card__where { margin-top: 12px; display: flex; align-items: center; gap: 12px; font: 500 30px/1.2 "Poppins"; color: var(--card-ink, var(--ink-soft)); opacity: 0.78; }
/* A thin band in the business's own colors along the bottom of its card. */
.card--brand::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 14px; background: repeating-linear-gradient(90deg, var(--hue) 0 40px, var(--stripe2, var(--white)) 40px 80px); }
.card__where svg { width: 32px; height: 32px; flex: none; }
.card__art { position: absolute; right: -30px; bottom: -60px; width: 300px; height: 300px; color: var(--hue); opacity: 0.12; }
.card__art svg { width: 100%; height: 100%; }
.card--tagged .card__name { padding-right: 96px; }
.card__tag {
  position: absolute;
  top: 118px;
  right: 40px;
  display: grid;
  place-items: center;
  width: 96px;
  height: 96px;
  border-radius: 50%;
  background: var(--navy-deep);
  color: var(--yellow);
  font: 800 56px/1 "Poppins";
}

.facts { margin-top: 26px; display: flex; flex-direction: column; gap: 18px; }
.fact { display: flex; align-items: center; gap: 20px; font: 600 40px/1.2 "Poppins"; }
.fact i { flex: none; display: grid; place-items: center; width: 56px; height: 56px; border-radius: 50%; background: var(--yellow); color: var(--ink); font: 800 30px/1 "Poppins"; font-style: normal; }

.vs {
  position: absolute;
  left: 50%;
  width: 170px;
  height: 170px;
  margin-left: -85px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: var(--yellow);
  color: var(--ink);
  font: 800 68px/1 "Poppins";
  letter-spacing: -0.03em;
  box-shadow: 0 0 0 14px var(--navy-deep), 0 20px 40px rgba(4, 8, 18, 0.6);
}

.cta {
  position: absolute;
  left: 70px;
  right: 70px;
  text-align: center;
}
.cta__big { font: 800 76px/1.05 "Poppins"; color: var(--yellow); letter-spacing: -0.02em; }
.cta__small { position: relative; margin-top: 12px; height: 46px; font: 600 38px/1.2 "Poppins"; color: var(--mist); }
.cta__small span { position: absolute; left: 0; right: 0; }

/* "SAVE" stamp, like swiping right in the app. */
.stamp { position: absolute; top: 46%; right: 60px; z-index: 4; padding: 10px 26px; border: 8px solid var(--yellow); border-radius: 18px; color: var(--yellow); background: rgba(16, 26, 46, 0.86); font: 800 64px/1 "Poppins"; letter-spacing: 0.04em; transform: rotate(-12deg); opacity: 0; }

/* How far apart the two places are. */
.apart { position: absolute; z-index: 5; padding: 12px 24px; border-radius: 999px; background: var(--white); color: var(--ink); font: 700 32px/1 "Poppins"; box-shadow: 0 10px 24px rgba(4, 8, 18, 0.45); white-space: nowrap; }
</style>
</head>
<body>
<div class="frame" id="frame"></div>
<script type="module">
import { GROUPS, iconSvg } from "../js/categories.js";

const PIN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-6.5-6-6.5-11a6.5 6.5 0 0 1 13 0c0 5-6.5 11-6.5 11zM14 10a2 2 0 1 1-4 0 2 2 0 0 1 4 0z"/></svg>';
const frame = document.getElementById("frame");
const tracks = []; // [element, (t) => style]

function el(tag, cls, html) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (html != null) node.innerHTML = html;
  return node;
}
const text = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const awning = (n) => el("div", "awning", "<span></span>".repeat(n));

/* ---- timing ---- */
const clamp = (x) => Math.max(0, Math.min(1, x));
const outCubic = (x) => 1 - (1 - x) ** 3;
const outBack = (x) => 1 + 2.4 * (x - 1) ** 3 + 1.4 * (x - 1) ** 2;
const at = (t, start, dur) => clamp((t - start) / dur);

function rise(node, start, dur = 0.5, dist = 60) {
  tracks.push([node, (t) => {
    const k = outCubic(at(t, start, dur));
    return { opacity: k, transform: `translateY(${(1 - k) * dist}px)` };
  }]);
}
function slide(node, start, from, dur = 0.6) {
  tracks.push([node, (t) => {
    const k = outBack(at(t, start, dur));
    return { opacity: clamp(at(t, start, dur * 0.4)), transform: `translateX(${(1 - k) * from}px)` };
  }]);
}
function pop(node, start, { pulse = false } = {}) {
  tracks.push([node, (t) => {
    const k = outBack(at(t, start, 0.45));
    const beat = pulse && t > start + 0.6 ? 1 + 0.05 * Math.sin((t - start) * 5) : 1;
    return { opacity: clamp(at(t, start, 0.15)), transform: `scale(${k * beat})` };
  }]);
}
function drop(node, start) {
  tracks.push([node, (t) => ({ transform: `translateY(${-(1 - outCubic(at(t, start, 0.5))) * 140}px)` })]);
}

/* ---- pieces ---- */
function card(place, { top, tag = "", facts = null }) {
  const g = GROUPS[place.group] || GROUPS.finds;
  const node = el("div", "card");
  node.style.top = `${top}px`;
  node.style.setProperty("--hue", g.color);
  // The business's own colors, taken from its sign and website.
  if (place.brand) {
    const b = place.brand;
    node.classList.add("card--brand");
    node.style.setProperty("--hue", b.a);
    for (const [prop, value] of [["--stripe2", b.b], ["--card-ink", b.ink], ["--card-paper", b.paper], ["--on-hue", b.on]]) {
      if (value) node.style.setProperty(prop, value);
    }
  }
  const a = awning(9);
  a.style.setProperty("--drop", "34px");
  const wrap = el("div", "card__awning-wrap");
  wrap.append(a);
  node.append(wrap);
  const kind = el("div", "card__kind", `<span class="card__icon">${iconSvg(place.group)}</span><span>${text(place.label)}</span>`);
  if (place.photo) {
    node.classList.add("card--photo");
    const box = el("div", "card__photo");
    const img = el("img", "shot");
    img.src = place.photo.file;
    img.alt = "";
    box.append(img);
    if (place.logo) box.append(el("div", "card__logo", `<img src="${text(place.logo.file)}" alt="">`));
    if (place.photo.kind === "map") box.append(el("div", "card__pin", PIN_SVG));
    kind.classList.add("card__kind--chip");
    box.append(kind);
    const credit = photoCredit(place.photo);
    if (credit) box.append(el("p", "card__credit", text(credit)));
    node.append(box);
    // A slow push-in, so the photo feels alive.
    tracks.push([img, (t) => ({ transform: `scale(${1.02 + 0.06 * (t / 10)})` })]);
  }
  const body = el("div", "card__body");
  body.append(el("div", "card__art", iconSvg(place.group)));
  if (!place.photo) body.append(kind);
  body.append(el("h2", "card__name", text(place.name)));
  if (place.fact && !facts) body.append(el("p", "card__fact", text(place.fact)));
  body.append(el("p", "card__where", `${PIN}<span>${text([place.street, place.city].filter(Boolean).join(", "))}</span>`));
  if (facts) {
    const list = el("div", "facts");
    facts.forEach((f) => list.append(el("p", "fact", `<i>✓</i><span>${text(f)}</span>`)));
    body.append(list);
  }
  node.append(body);
  if (tag) {
    node.classList.add("card--tagged");
    node.append(el("div", "card__tag", text(tag)));
  }
  return node;
}

// The real street map around a place, as a picture (same free map as the app).
let mapLib = null;
let mapView = null;
async function mapShot(lat, lon) {
  mapLib ||= import("../vendor/maplibre/maplibre-gl.mjs");
  const gl = await mapLib;
  const wait = (map, event) => new Promise((ok, bad) => {
    const timer = setTimeout(() => bad(new Error(`map ${event} timed out`)), 20000);
    map.once(event, () => { clearTimeout(timer); ok(); });
  });
  if (!mapView) {
    const box = el("div");
    box.style.cssText = "position:fixed;left:-5000px;top:0;width:880px;height:520px;";
    document.body.append(box);
    mapView = new gl.Map({ container: box, style: "https://tiles.openfreemap.org/styles/liberty", center: [lon, lat], zoom: 16.6, interactive: false, attributionControl: false, preserveDrawingBuffer: true, fadeDuration: 0, pixelRatio: 1 });
    mapView.on("error", () => {});
    await wait(mapView, "load");
  }
  mapView.jumpTo({ center: [lon, lat], zoom: 16.6 });
  await wait(mapView, "idle");
  return mapView.getCanvas().toDataURL("image/jpeg", 0.9);
}

const PIN_SVG = '<svg viewBox="0 0 40 52"><path d="M20 51s17-17.6 17-30.5A17 17 0 0 0 3 20.5C3 33.4 20 51 20 51z" fill="#FEC300" stroke="#101A2E" stroke-width="3"/><circle cx="20" cy="20.5" r="6.5" fill="#101A2E"/></svg>';

// Openly licensed photos must credit the photographer and license; the owner's own photos need no line.
function photoCredit(photo) {
  if (photo.kind === "map") return "Map: OpenFreeMap, © OpenStreetMap";
  if (photo.kind === "cc") return `Photo: ${photo.credit}, ${photo.license}`;
  if (photo.kind === "business") return `Photo: ${photo.credit}`;
  return "";
}

// The header (awning, wordmark, hook) is already in place on the very first frame, so the video's
// default cover in TikTok's grid shows the full title instead of an empty frame mid fade-in.
function header(post) {
  const top = awning(11);
  frame.append(top);
  const brand = el("div", "brand", "HOW<b>LOCAL</b>");
  frame.append(brand);
  const hook = el("h1", "hook");
  post.hook.forEach((line) => hook.append(el("span", "", text(line))));
  frame.append(hook);
}

function cta(post, top, start) {
  const box = el("div", "cta", `<p class="cta__big">${text(post.cta[0])}</p><p class="cta__small"><span class="one">${text(post.cta[1] || "")}</span><span class="two">${post.format === "spotlight" ? "Save it in the HowLocal app" : "Save your pick in the HowLocal app"}</span></p>`);
  box.style.top = `${top}px`;
  rise(box, start);
  const one = box.querySelector(".one");
  const two = box.querySelector(".two");
  const swapAt = start + 3.4;
  tracks.push([one, (t) => ({ opacity: 1 - at(t, swapAt, 0.3) })]);
  tracks.push([two, (t) => ({ opacity: at(t, swapAt + 0.2, 0.3), transform: `translateY(${(1 - outCubic(at(t, swapAt + 0.2, 0.4))) * 20}px)` })]);
  frame.append(box);
}

// Distance between two places, from their map points.
function milesApart(a, b) {
  const rad = (d) => (d * Math.PI) / 180;
  const h = Math.sin(rad(b.lat - a.lat) / 2) ** 2 + Math.cos(rad(a.lat)) * Math.cos(rad(b.lat)) * Math.sin(rad(b.lon - a.lon) / 2) ** 2;
  const mi = 3958.8 * 2 * Math.asin(Math.sqrt(h));
  return mi < 0.1 ? "next door to each other" : `${mi.toFixed(1)} mi apart`;
}

/* ---- the three formats ---- */
const FORMATS = {
  // Two places from the same area, side by side: viewers vote in the comments.
  versus(post) {
    const tags = post.tags || ["A", "B"];
    const a = card(post.places[0], { top: 520, tag: tags[0] });
    const b = card(post.places[1], { top: 960, tag: tags[1] });
    const stamp = el("div", "stamp", "SAVE");
    a.append(stamp);
    a.classList.add("card--first");
    frame.append(a, b);
    // With a map or photo on both, the two cards stand side by side like two app cards.
    const side = post.places.every((p) => p.photo);
    if (side) frame.classList.add("side");
    // A shows alone first, bigger and centered on the open space, then moves aside to make room for B.
    const solo = () => {
      const free = [a.offsetTop, 1620];
      return {
        dx: side ? 540 - (a.offsetLeft + a.offsetWidth / 2) : 0,
        dy: side ? 0 : (free[0] + free[1]) / 2 - (a.offsetTop + a.offsetHeight / 2),
        s: side ? 1.28 : 1.1,
      };
    };
    tracks.push([a, (t) => {
      const { dx, dy, s } = solo();
      const enter = outBack(at(t, 1.2, 0.6));
      const settle = outCubic(at(t, 4.4, 0.6));
      const swipe = Math.sin(Math.PI * at(t, 8.6, 1.2)); // a quick swipe right and back
      const x = (1 - enter) * -1100 + swipe * 70 + dx * (1 - settle);
      const y = dy * (1 - settle);
      const scale = s + (1 - s) * settle;
      return { opacity: at(t, 1.2, 0.2), transform: `translate(${x}px, ${y}px) rotate(${swipe * 6}deg) scale(${scale})` };
    }]);
    tracks.push([stamp, (t) => ({ opacity: Math.sin(Math.PI * at(t, 8.6, 1.2)) })]);
    slide(b, 4.8, 1100);
    if (post.vs !== false) {
      const vs = el("div", "vs", "VS");
      vs.style.top = "880px";
      pop(vs, 5.5, { pulse: true });
      frame.append(vs);
    }
    if (post.places[0].lat && post.places[1].lat) {
      const apart = el("div", "apart", text(milesApart(post.places[0], post.places[1])));
      pop(apart, 6.1);
      frame.append(apart);
    }
    // Space the cards evenly once their heights are known.
    return () => {
      const hook = frame.querySelector(".hook");
      a.style.top = `${hook.offsetTop + hook.offsetHeight + 50}px`;
      if (side) {
        // Two columns, same height, VS on the seam where the pictures end.
        b.style.top = a.style.top;
        a.style.left = "50px";
        b.style.left = "560px";
        a.style.minHeight = b.style.minHeight = "0px";
        const tall = Math.max(a.offsetHeight, b.offsetHeight);
        a.style.minHeight = b.style.minHeight = `${tall}px`;
        const seam = a.offsetTop + a.querySelector(".card__photo").offsetTop + a.querySelector(".card__photo").offsetHeight;
        const vs = frame.querySelector(".vs");
        if (vs) {
          vs.style.top = `${seam - 200}px`; // on the pictures, clear of both names
        }
        const apart = frame.querySelector(".apart");
        let end = a.offsetTop + tall;
        if (apart) {
          apart.style.top = `${end + 34}px`;
          apart.style.left = `${(1080 - apart.offsetWidth) / 2}px`;
          end += 34 + apart.offsetHeight;
        }
        return end + 40;
      }
      const gap = post.vs === false ? 60 : 120;
      b.style.top = `${a.offsetTop + a.offsetHeight + gap}px`;
      const vs = frame.querySelector(".vs");
      if (vs) vs.style.top = `${a.offsetTop + a.offsetHeight + gap / 2 - 85}px`;
      const apart = frame.querySelector(".apart");
      if (apart) {
        apart.style.top = `${a.offsetTop + a.offsetHeight + gap / 2 - 26}px`;
        apart.style.left = post.vs === false ? `${(1080 - apart.offsetWidth) / 2}px` : "640px";
      }
      const end = b.offsetTop + b.offsetHeight;
      return end + 50;
    };
  },
  // One place, with a few checked facts.
  spotlight(post) {
    const c = card(post.places[0], { top: 500, facts: post.places[0].facts || [] });
    rise(c, 1.0, 0.6, 140);
    frame.append(c);
    c.querySelectorAll(".fact").forEach((f, i) => rise(f, 2.0 + i * 0.8, 0.45, 30));
    return () => {
      const hook = frame.querySelector(".hook");
      c.style.top = `${hook.offsetTop + hook.offsetHeight + 60}px`;
      return c.offsetTop + c.offsetHeight + 60;
    };
  },
};
FORMATS.list = (post) => FORMATS.versus({ ...post, tags: post.places.map((_, i) => String(i + 1)), vs: false });

/* ---- what render.mjs calls ---- */
window.build = async (post) => {
  frame.replaceChildren();
  frame.style.setProperty("--photo-h", post.format === "spotlight" ? "540px" : "270px");
  frame.style.removeProperty("--fit");
  frame.classList.remove("side");
  tracks.length = 0;
  // Places without a real photo show the real street map around them instead.
  for (const place of post.places) {
    if (place.photo || !Number.isFinite(place.lat)) continue;
    try {
      place.photo = { file: await mapShot(place.lat, place.lon), kind: "map" };
    } catch {
      /* no map: the card keeps its plain look */
    }
  }
  header(post);
  const layout = FORMATS[post.format](post);
  await document.fonts.ready;
  await Promise.all([...frame.querySelectorAll("img")].map((img) => (img.complete ? null : new Promise((ok, bad) => { img.onload = ok; img.onerror = () => bad(new Error(`picture didn't load: ${img.src}`)); }))));
  let ctaTop = layout();
  cta(post, ctaTop, post.format === "spotlight" ? 4.8 : 6.6);
  const box = frame.querySelector(".cta");
  // TikTok's caption and buttons cover the bottom of the screen: everything must end above them.
  // Long names and photos shrink a little until the post fits.
  for (const fit of [0.9, 0.82, 0.75, 0.68, 0.6]) {
    if (box.offsetTop + box.offsetHeight <= 1640) break;
    frame.style.setProperty("--fit", fit);
    box.style.top = `${layout()}px`;
  }
  window.seek(0);
  return { overflow: box.offsetTop + box.offsetHeight > 1640 };
};

window.seek = (t) => {
  for (const [node, style] of tracks) Object.assign(node.style, style(t));
};
</script>
