# Rebuilds the listing files in data/places from OpenStreetMap.
# Runs on the 1st of each month, when the build scripts change, or by hand from the Actions tab.
# Uses only GitHub's standard runners, which are free for public repositories.
name: Refresh listings

on:
  workflow_dispatch:
  schedule:
    - cron: "17 10 1 * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/refresh-listings.yml"
      - "scripts/extract-places.py"
      - "scripts/build-places.mjs"
      - "scripts/tiles-lib.mjs"
      - "js/categories.js"
      - "js/places.js"

permissions:
  contents: write
  pages: write

concurrency:
  group: refresh-listings
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install the map-file reader
        run: pip install "osmium>=4.2,<5"

      - name: Download the California map extract
        run: |
          curl --fail --location --retry 3 --retry-delay 20 \
            --user-agent "howlocal-app listings build (github.com/${{ github.repository }})" \
            --output region.osm.pbf \
            https://download.geofabrik.de/north-america/us/california-latest.osm.pbf
          ls -lh region.osm.pbf

      - name: Pull out shops and food spots
        run: python scripts/extract-places.py region.osm.pbf raw-places.jsonl

      - name: Build the listing files
        run: node scripts/build-places.mjs raw-places.jsonl data/places "California"

      - name: Save the new listings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all data/places
          if git diff --cached --quiet; then
            echo "Listings are unchanged."
            exit 0
          fi
          git commit --quiet -m "Refresh listings from OpenStreetMap ($(date -u +%F))"
          git pull --rebase --quiet origin main
          git push origin HEAD:main

      - name: Ask GitHub Pages to republish
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${{ github.repository }}/pages/builds"
